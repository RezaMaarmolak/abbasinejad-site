<script>
const quotes = [
  "آینده از تصمیم‌هایی ساخته می‌شود که امروز می‌گیری.",
  "قرار نیست کامل باشی؛ قرار است ادامه بدهی.",
  "هر قدم کوچک، بخشی از یک تغییر بزرگ است.",
  "تمرکز امروز، نتیجه‌ی فردای تو را می‌سازد.",
  "شروع کردن مهم‌تر از کامل شروع کردن است.",
  "به مسیرت اعتماد کن و برای بهتر شدن ادامه بده.",
  "هدف بزرگ، با قدم‌های منظم به دست می‌آید."
];

const typed = document.getElementById("typed");
const progress = document.getElementById("progress");

let quoteIndex = 0;
let charIndex = 0;
let deleting = false;

function typeLoop() {
  if (document.hidden) { setTimeout(typeLoop, 600); return; }
  const current = quotes[quoteIndex];

  if (!deleting) {
    typed.textContent = current.slice(0, charIndex++);
    progress.style.width = (charIndex / current.length * 100) + "%";

    if (charIndex > current.length) {
      deleting = true;
      setTimeout(typeLoop, 2300);
      return;
    }
    setTimeout(typeLoop, 48);
  } else {
    typed.textContent = current.slice(0, charIndex--);
    progress.style.width = (charIndex / current.length * 100) + "%";

    if (charIndex < 0) {
      deleting = false;
      charIndex = 0;
      quoteIndex = (quoteIndex + 1) % quotes.length;
      setTimeout(typeLoop, 500);
      return;
    }
    setTimeout(typeLoop, 24);
  }
}
typeLoop();
</script>

<script id="scroll-reveal-script">
document.addEventListener("DOMContentLoaded",function(){
 const items=document.querySelectorAll(".scroll-reveal");
 const observer=new IntersectionObserver((entries)=>{
   entries.forEach(entry=>{
     if(entry.isIntersecting){
       entry.target.classList.add("is-visible");
       observer.unobserve(entry.target);
     }
   });
 },{threshold:.16,rootMargin:"0px 0px -70px 0px"});
 items.forEach(el=>observer.observe(el));
});
</script>

<script id="content-protection-script">
(function(){
  "use strict";
  // Anti-framing (clickjacking)
  try{ if(window.top!==window.self){ window.top.location=window.self.location; } }catch(e){ document.documentElement.style.display="none"; }

  var stop=function(e){ e.preventDefault(); e.stopPropagation(); return false; };
  ["contextmenu","selectstart","dragstart","drag","drop","copy","cut","paste","beforecopy","beforecut"].forEach(function(t){
    document.addEventListener(t, stop, true);
  });
  document.addEventListener("copy",function(e){ if(e.clipboardData){ e.clipboardData.setData("text/plain",""); } e.preventDefault(); },true);

  // Block risky keyboard shortcuts
  document.addEventListener("keydown",function(e){
    var k=(e.key||"").toLowerCase(), c=e.ctrlKey||e.metaKey;
    var blocked =
      e.key==="F12" ||
      e.key==="PrintScreen" ||
      (c && ["s","u","p","c","x","a","o"].indexOf(k)>-1) ||
      (c && e.shiftKey && ["i","j","c","k","s"].indexOf(k)>-1) ||
      (e.metaKey && e.altKey && ["i","j","c","u"].indexOf(k)>-1);
    if(blocked){
      if(e.key==="PrintScreen" && navigator.clipboard){ try{ navigator.clipboard.writeText(""); }catch(_){} }
      return stop(e);
    }
  },true);
  document.addEventListener("keyup",function(e){
    if(e.key==="PrintScreen"){ try{ navigator.clipboard.writeText(""); }catch(_){} }
  },true);

  // Hide content while printing
  window.addEventListener("beforeprint",function(){ document.body.style.visibility="hidden"; });
  window.addEventListener("afterprint",function(){ document.body.style.visibility=""; });


  // Basic DevTools detection (desktop only): blur page while docked tools are open
  var isTouch=("ontouchstart" in window)||navigator.maxTouchPoints>0;
  if(!isTouch){
    var check=function(){
      var wGap=window.outerWidth-window.innerWidth>200;
      var hGap=window.outerHeight-window.innerHeight>200;
      document.body.classList.toggle("dt-open", wGap||hGap);
    };
    setInterval(check,1000); window.addEventListener("resize",check); check();
  }
})();
</script>


<style id="liquid-glass-ios">
/* ================= iOS-style Liquid Glass ================= */
:root{
  --lg-blur:24px;
  --lg-blur-nav:20px;
  --lg-ease:cubic-bezier(.22,1,.36,1);
  --lg-spring:cubic-bezier(.34,1.56,.64,1);
  --lg-rim-hi:rgba(255,255,255,.82);
  --lg-rim-lo:rgba(255,255,255,.38);
}

/* ---- base mobile behaviour (fonts untouched) ---- */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:#080813;touch-action:manipulation}
body{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px);overflow-x:hidden}
a,button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.scroll-hint{bottom:calc(22px + env(safe-area-inset-bottom,0px))}
@media (max-height:480px) and (orientation:landscape){.scroll-hint{display:none}}

/* ---- keep the glass able to "see" the page behind it ----
   (a leftover filter/animation fill makes the browser flatten the backdrop and the glass flickers) */
.nav,.hero-doctor,.hero h1,.call-main{animation-fill-mode:backwards}
.scroll-reveal.is-visible{filter:none}

/* ---- glass shell: the glass itself lives on ::before / ::after ---- */
html .glass{
  background:transparent;
  border:0;
  -webkit-backdrop-filter:none;backdrop-filter:none;
  box-shadow:0 14px 40px rgba(0,0,0,.30),0 2px 8px rgba(0,0,0,.18);
  isolation:isolate;
}
html .glass:not(.nav){position:relative}
html .glass > *:not(.doctor-glow){position:relative;z-index:1}

/* Layer 1: refractive body = light blur + saturation boost + tint */
html .glass::before{
  content:"";position:absolute;inset:0;width:auto;height:auto;
  border-radius:inherit;z-index:0;pointer-events:none;filter:none;
  background:
    radial-gradient(120% 90% at 0% 0%,rgba(255,255,255,.22),transparent 55%),
    linear-gradient(135deg,rgba(255,255,255,.13),rgba(160,189,219,.045) 50%,rgba(255,255,255,.08));
  -webkit-backdrop-filter:blur(var(--lg-blur)) saturate(190%) brightness(1.1);
  backdrop-filter:blur(var(--lg-blur)) saturate(190%) brightness(1.1);
  -webkit-transform:translateZ(0);transform:translateZ(0);
}
/* Layer 2: specular rim + sheen that follows your finger */
html .glass::after{
  content:"";position:absolute;inset:0;width:auto;height:auto;
  border-radius:inherit;z-index:3;pointer-events:none;filter:none;
  background:
    radial-gradient(circle 150px at var(--mx,18%) var(--my,0%),rgba(255,255,255,.20),transparent 70%),
    linear-gradient(180deg,rgba(255,255,255,.10),transparent 42%);
  box-shadow:
    inset 1.5px 1.5px 1px -.5px var(--lg-rim-hi),
    inset -1.5px -1.5px 1px -.5px var(--lg-rim-lo),
    inset 0 0 0 1px rgba(255,255,255,.09),
    inset 0 0 28px rgba(255,255,255,.07);
}

/* ---- top bar: floating glass pill (works on phones too) ---- */
html .nav{
  z-index:40;border-radius:34px;overflow:visible;transform:none;
  box-shadow:0 10px 32px rgba(0,0,0,.32),0 1px 3px rgba(0,0,0,.20);
}
html .nav::before{
  -webkit-backdrop-filter:blur(var(--lg-blur-nav)) saturate(200%) brightness(1.12);
  backdrop-filter:blur(var(--lg-blur-nav)) saturate(200%) brightness(1.12);
  transition:background .35s ease;
}
html .nav.is-scrolled::before{
  background:
    radial-gradient(120% 90% at 0% 0%,rgba(255,255,255,.26),transparent 55%),
    linear-gradient(135deg,rgba(255,255,255,.17),rgba(160,189,219,.07) 50%,rgba(255,255,255,.12));
}


/* ---- top bar fades away while scrolling down, returns when scrolling up ---- */
html .nav{
  transition:opacity .45s var(--lg-ease),transform .45s var(--lg-ease),visibility 0s 0s;
}
html .nav.nav-hidden{
  opacity:0;transform:translateY(-14px);visibility:hidden;pointer-events:none;
  transition:opacity .45s var(--lg-ease),transform .45s var(--lg-ease),visibility 0s .45s;
}
@media (prefers-reduced-motion:reduce){
  html .nav,html .nav.nav-hidden{transition:opacity .2s linear,visibility 0s .2s;transform:none}
}

/* ---- doctor photo: glass lens ring ---- */
html .hero-doctor{box-shadow:0 28px 70px rgba(0,0,0,.42),0 4px 14px rgba(0,0,0,.25)}

/* ---- quote card ---- */
html .quote-card{border-radius:26px}

/* ---- contact cards ---- */
html .contact-card{border-radius:34px}
html .contact-card.scroll-reveal{
  transition:
    opacity .8s var(--lg-ease),
    transform .8s var(--lg-ease),
    filter .8s ease,
    scale .5s var(--lg-spring),
    box-shadow .3s ease;
}
/* stagger only the reveal, never the press */
html .contact-card.scroll-reveal:nth-child(1){transition-delay:.1s,.1s,.1s,0s,0s}
html .contact-card.scroll-reveal:nth-child(2){transition-delay:.2s,.2s,.2s,0s,0s}
html .contact-card.scroll-reveal:nth-child(3){transition-delay:.3s,.3s,.3s,0s,0s}

/* ---- glass icon bubbles ---- */
html .icon-wrap{
  border:0;
  background:
    radial-gradient(circle at 30% 20%,rgba(255,255,255,.34),transparent 45%),
    linear-gradient(145deg,rgba(255,255,255,.20),rgba(160,189,219,.05));
  box-shadow:
    inset 1.5px 1.5px 1px -.5px rgba(255,255,255,.85),
    inset -1.5px -1.5px 1px -.5px rgba(255,255,255,.40),
    inset 0 0 0 1px rgba(255,255,255,.12),
    inset 0 0 16px rgba(255,255,255,.12),

  try{ gl=glc.getContext("webgl",{alpha:true,premultipliedAlpha:true,antialias:false,depth:false,stencil:false,powerPreference:"low-power"})||glc.getContext("experimental-webgl"); }catch(_){}
  if(!gl) return;

  var VS=[
    "attribute vec2 aPos;uniform vec4 uBox;uniform vec2 uCss;varying vec2 vP;",
    "void main(){vec2 p=uBox.xy+aPos*uBox.zw;vP=p;",
    "gl_Position=vec4(p.x/uCss.x*2.0-1.0,1.0-p.y/uCss.y*2.0,0.0,1.0);}"
  ].join("\n");
  var FS=[
    "#ifdef GL_FRAGMENT_PRECISION_HIGH","precision highp float;","#else","precision mediump float;","#endif",
    "uniform sampler2D uTex;uniform float uTexAspect;uniform vec4 uWrap;uniform vec4 uRect;uniform vec3 uPar;uniform vec2 uOrigin;varying vec2 vP;",
    "vec3 bg(vec2 pv){",
    "  vec2 uv=(pv-uWrap.xy)/uWrap.zw; float ca=uWrap.z/uWrap.w;",
    "  vec2 s=ca>uTexAspect?vec2(1.0,uTexAspect/ca):vec2(ca/uTexAspect,1.0);",
    "  uv=(uv-0.5)*s+0.5; uv.y=1.0-uv.y; return texture2D(uTex,uv).rgb;}",
    "void main(){",
    "  vec2 c=vP-uRect.xy;",
    "  vec2 q=abs(c)-(uRect.zw-vec2(uPar.x));",
    "  float sd=length(max(q,0.0))+min(max(q.x,q.y),0.0)-uPar.x;",
    "  float depth=-sd; float b=uPar.y;",
    "  if(depth<-1.0||depth>b){discard;}",
    "  vec2 sg=vec2(c.x<0.0?-1.0:1.0,c.y<0.0?-1.0:1.0);",
    "  vec2 n;",
    "  if(q.x>0.0&&q.y>0.0){n=normalize(q)*sg;}else if(q.x>q.y){n=vec2(sg.x,0.0);}else{n=vec2(0.0,sg.y);}",
    "  float t=clamp(1.0-depth/b,0.0,1.0); float m=t*t*(0.55+0.45*t);",
    "  vec2 pv=vP+uOrigin; vec2 off=-n*m*b*2.2;",
    "  vec3 col; col.r=bg(pv+off*1.12).r; col.g=bg(pv+off).g; col.b=bg(pv+off*0.88).b;",
    "  float lum=dot(col,vec3(0.299,0.587,0.114)); col=mix(vec3(lum),col,1.35)*1.06;",
    "  col=mix(col,vec3(0.80,0.88,0.98),0.12+0.14*t);",
    "  float lit=dot(n,normalize(vec2(-0.6,-0.8)));",
    "  col+=t*t*(max(lit,0.0)*0.30+max(-lit,0.0)*0.12);",
    "  col+=(1.0-smoothstep(0.0,2.0,depth))*(0.05+0.14*max(lit,0.0));",
    "  float a=pow(1.0-smoothstep(0.0,1.0,depth/b),1.7)*smoothstep(-1.0,1.2,depth);",
    "  a*=0.66;",
    "  gl_FragColor=vec4(col*a,a);",
    "}"
  ].join("\n");

  function sh(type,src){var o=gl.createShader(type);gl.shaderSource(o,src);gl.compileShader(o);
    if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(o));return o;}
  var prog,L={},tex;
  try{
    prog=gl.createProgram();
    gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));
    gl.linkProgram(prog);
    if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(prog));
    gl.useProgram(prog);
    var buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([0,0,1,0,0,1,1,1]),gl.STATIC_DRAW);
    var aPos=gl.getAttribLocation(prog,"aPos");gl.enableVertexAttribArray(aPos);gl.vertexAttribPointer(aPos,2,gl.FLOAT,false,0,0);
    ["uBox","uCss","uTex","uTexAspect","uWrap","uRect","uPar","uOrigin"].forEach(function(n){L[n]=gl.getUniformLocation(prog,n);});
    tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.uniform1i(L.uTex,0);
    gl.enable(gl.SCISSOR_TEST);
  }catch(err){ return; }   // shader problem: the CSS stand-in bezel stays

  var posterImg=new Image();posterImg.src="bg-poster.jpg";
  var items=[],lastSrc=null,raf=0,dead=false;

  function collect(){
    items=[].slice.call(document.querySelectorAll(".glass,.icon-wrap")).map(function(el){
      var c=el.querySelector(":scope > .lg-rimc");
      if(!c){c=document.createElement("canvas");c.className="lg-rimc";c.setAttribute("aria-hidden","true");el.appendChild(c);}
      var br=getComputedStyle(el).borderTopLeftRadius;
      return {el:el,cv:c,ctx:c.getContext("2d"),icon:el.classList.contains("icon-wrap"),doctor:el.classList.contains("hero-doctor"),
              rad0:/%/.test(br)?1e4:(parseFloat(br)||0),key:""};
    });
  }
  function source(){
    if(vid&&vid.readyState>=2&&vid.videoWidth)return {el:vid,w:vid.videoWidth,h:vid.videoHeight,live:true};
    if(posterImg.complete&&posterImg.naturalWidth)return {el:posterImg,w:posterImg.naturalWidth,h:posterImg.naturalHeight,live:false};
    return null;
  }
  function die(){
    dead=true;if(raf)cancelAnimationFrame(raf);
    items.forEach(function(it){if(it.cv.parentNode)it.cv.parentNode.removeChild(it.cv);});
    document.documentElement.classList.remove("rim-gl");
  }
  glc.addEventListener("webglcontextlost",function(e){e.preventDefault();die();});

  function frame(){
    raf=requestAnimationFrame(frame);
    if(dead)return;
    var vh=window.innerHeight, wr=wrap.getBoundingClientRect();
    var vt=(vid&&vid.readyState>=2)?vid.currentTime.toFixed(3):"p";
    var todo=[];
    for(var i=0;i<items.length;i++){
      var it=items[i],r=it.el.getBoundingClientRect();
      if(r.width<4||r.height<4||r.bottom<-30||r.top>vh+30)continue;
      var w=it.el.offsetWidth,h=it.el.offsetHeight; if(w<4||h<4)continue;
      var key=wr.top.toFixed(1)+","+wr.height.toFixed(1)+","+vt+","+r.left.toFixed(1)+","+r.top.toFixed(1)+","+w+","+h;
      if(key===it.key)continue;
      it.key=key; todo.push({it:it,r:r,w:w,h:h});
    }
    if(!todo.length)return;
    var src=source(); if(!src)return;
    try{
      gl.bindTexture(gl.TEXTURE_2D,tex);
      if(src.live||lastSrc!==src.el){gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,src.el);lastSrc=src.el;}
      gl.uniform1f(L.uTexAspect,src.w/src.h);
      gl.uniform4f(L.uWrap,wr.left,wr.top,wr.width,wr.height);
      var S=Math.min(2,Math.max(1,(window.devicePixelRatio||1)*.75));
      for(var k=0;k<todo.length;k++){
        var o=todo[k],it2=o.it;
        var cw=Math.min(GLW,Math.round(o.w*S)), ch=Math.min(GLH,Math.round(o.h*S));
        if(it2.cv.width!==cw||it2.cv.height!==ch){it2.cv.width=cw;it2.cv.height=ch;}
        var m=Math.min(o.w,o.h);
        var rad=Math.min(it2.rad0,o.w/2,o.h/2);
        var b=it2.icon?13:it2.doctor?11:Math.max(12,Math.min(19,m*.30));
        gl.viewport(0,0,cw,ch); gl.scissor(0,0,cw,ch);
        gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
        gl.uniform2f(L.uCss,o.w,o.h);
        gl.uniform4f(L.uBox,0,0,o.w,o.h);
        gl.uniform4f(L.uRect,o.w/2,o.h/2,o.w/2,o.h/2);
        gl.uniform2f(L.uOrigin,o.r.left,o.r.top);
        gl.uniform3f(L.uPar,rad,b,1);
        gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
        it2.ctx.clearRect(0,0,cw,ch);
        it2.ctx.drawImage(glc,0,GLH-ch,cw,ch,0,0,cw,ch);
      }
    }catch(err){ die(); }   // e.g. the browser refuses to read the video into WebGL
  }

  collect();
  document.documentElement.classList.add("rim-gl");
  window.addEventListener("load",collect);
  raf=requestAnimationFrame(frame);
})();
</script>

<style id="no-zoom">
html,body,*{touch-action:pan-x pan-y}
</style>
<script id="no-zoom-js">
(function(){
  var opt={passive:false};
  // iOS Safari ignores user-scalable=no, so block pinch gestures directly
  ["gesturestart","gesturechange","gestureend"].forEach(function(n){
    document.addEventListener(n,function(e){e.preventDefault();},opt);
  });
  document.addEventListener("touchmove",function(e){
    if(e.touches&&e.touches.length>1){e.preventDefault();}
  },opt);
  // block double-tap zoom
  var last=0;
  document.addEventListener("touchend",function(e){
    var now=Date.now();
    if(now-last<=300){e.preventDefault();}
    last=now;
  },opt);
  // desktop: Ctrl + wheel and Ctrl +/-/0
  window.addEventListener("wheel",function(e){if(e.ctrlKey){e.preventDefault();}},opt);
  window.addEventListener("keydown",function(e){
    if((e.ctrlKey||e.metaKey)&&["+","=","-","_","0"].indexOf(e.key)>-1){e.preventDefault();}
  });
})();
</script>
